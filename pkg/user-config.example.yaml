# Per-user configuration. This file is optional: without it the daemon starts
# with the same values this template shows uncommented (they are the built-in
# defaults, and a unit test keeps the two in step). Copy it to
# ~/.config/ds5dummy/config.yaml to change anything, and keep it owned by the
# target user (or root) and not writable by group or others.
#
# enabled: false turns the service off for this user without deleting the file.
enabled: true

# Which Bluetooth controllers this user serves:
#   auto  every supported DualSense found in the system (default)
#   list  only the controllers named under controllers:
#   MAC   just that controller, e.g. "AA:BB:CC:DD:EE:FF"
bt_addr: auto

# Settings are layered: built-in defaults <- global: <- controllers:<MAC>.
# Every key below is optional; a key you write replaces the inherited value for
# that group only. The example values are the built-in defaults.
#
# global:
#   # Seconds the worker keeps retrying the Bluetooth link before giving up
#   # (0 = do not wait).
#   bt_wait_s: 60
#   # false = bridge HID only, no audio downlink or virtual microphone.
#   audio: true
#   # Haptics amplitude multiplier, 0.0 (silent) .. 2.0 (twice as strong).
#   # 1.0 leaves the rumble samples exactly as the host sent them. Applied
#   # before the int8 quantisation, so it never affects the speaker.
#   haptics_gain: 1.0
#   # Controller-side speaker pre-gain, 0..7 (SetStateData byte 37, low 3 bits).
#   # The firmware default is 2; raising it amplifies on the pad, after our
#   # encode.
#   speaker_gain: 2
#   # Interval between two USB input reports, in milliseconds: 1, 2 or 4
#   # (1000/500/250 Hz). The worker paces those reports itself — on dummy_hcd
#   # the host does not poll according to the descriptor's bInterval, so
#   # without this interval the held report would be streamed out several
#   # thousand times per second. Between Bluetooth samples the held report is
#   # resent verbatim. 0 = real-time: send one report per new Bluetooth
#   # sample only.
#   # This is the USB side only — the controller's own report rate over
#   # Bluetooth is fixed by its firmware and cannot be changed from here.
#   usb_report_interval_ms: 1
#   # Which model the virtual USB device presents:
#   #   auto       follow the real pad's HID identity (default): a DualSense
#   #              Edge is presented as an Edge, anything else as a plain
#   #              DualSense
#   #   dualsense  always present as a plain DualSense (054c:0ce6)
#   #   edge       always present as a DualSense Edge (054c:0df2)
#   # The model decides the USB PID, the product string and the HID report
#   # descriptor; they always change together. Useful when the pad is offline
#   # at startup (bt_addr with a single MAC) or when the host should see a
#   # different model on purpose.
#   usb_model: auto
#
# Plugin settings. Plugins are shared objects and the worker loads them by
# itself: every .so file in /usr/lib/ds5dummy/plugins (the shipped one) and in
# ~/.config/ds5dummy/plugins (yours) is a candidate. Nothing here decides what
# gets loaded. A file is loaded only when it carries the DS5Dummy marker
# section and exports ds5_plugin_desc with the ABI version this build expects;
# anything else is skipped with a line in the worker log. When both
# directories hold a plugin with the same name, yours wins.
#
# Each plugin sees only its own block — the keys under plugins:<name>: — and
# nothing else. A key the plugin does not know is ignored and a bad value only
# affects that plugin (it reports the problem in the worker log and falls back
# to its own default). Per-controller overrides go under
# controllers:<MAC>.plugins: and replace only the keys you write there.
#
# plugins:
#   # idle: powers the controller off by sending the 0x08 feature report when
#   # nobody touches it. A stick outside its centre band, a trigger, the D-pad
#   # or any button counts as input; touchpad contact and motion do not.
#   idle:
#     # Minutes without any user input before the controller is asked to power
#     # itself off (0 = never power off automatically; range 0..60).
#     off_after_minutes: 30
#
# Plugins run as arbitrary code inside the worker process: they can rewrite the
# input state they are given and can start their own threads. The marker and
# the ABI version prove only that the file was built for this interface — they
# are not a signature. There is no ownership or permission check, so keep only
# .so files you compiled or reviewed yourself in the plugin directories.
#
# Per-controller overrides. Keys are the controller's BD_ADDR in uppercase
# XX:XX:XX:XX:XX:XX; only the keys you write are overridden. With
# bt_addr: list this section doubles as the allowlist, so it must name at
# least one controller.
#
# controllers:
#   "AA:BB:CC:DD:EE:FF":
#     audio: false
#     haptics_gain: 1.5
#     plugins:
#       idle:
#         off_after_minutes: 0

# Personal log level, overriding the system-wide one. Names or integers, same
# vocabulary as the daemon's -v option: OFF/FATAL/ERROR/WARNING/INFO/DEBUG/
# VERBOSE/TRACE.
# log_level: INFO
