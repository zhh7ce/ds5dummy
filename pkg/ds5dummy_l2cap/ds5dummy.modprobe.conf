# DS5Dummy L2CAP — kernel module configuration

# Full-speed-only dummy UDCs: DS5Dummy supplies FunctionFS FS descriptors.
# Each simultaneously served controller needs its own dummy_udc.N.  The default
# of 3 covers three pads at once; raise it if you bridge more (the kernel
# accepts 1..32).
options dummy_hcd is_high_speed=0 num=3

# No hidp blacklist: the L2CAP backend intentionally lets BlueZ establish the
# HIDP session first, then hands PSM 0x11/0x13 over to DS5Dummy.
